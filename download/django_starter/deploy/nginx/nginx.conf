# ============================================================
# Nginx Configuration — Reverse Proxy for Workshop Management
# ============================================================
worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;  # برای آپلود تصاویر محصول

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_proxied any;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # Upstream - Backend
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Redirect HTTP to HTTPS (فعلاً فعال نیست)
        # return 301 https://$host$request_uri;

        # API
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Login endpoint (strict rate limit)
        location /api/auth/login/ {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://backend;
        }

        # Static files (cached for 30 days)
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Media files (cached for 1 day)
        location /media/ {
            alias /var/www/media/;
            expires 1d;
            access_log off;
        }

        # Health check (no rate limit)
        location /api/health/ {
            proxy_pass http://backend;
            access_log off;
        }

        # Frontend (Next.js) - to be added
        # location / {
        #     proxy_pass http://frontend:3000;
        # }
    }

    # HTTPS server (فعلاً غیرفعال، وقتی SSL داشتید فعال کنید)
    # server {
    #     listen 443 ssl http2;
    #     server_name workshop.local;
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     # ... (همان تنظیمات بالا)
    # }
}
