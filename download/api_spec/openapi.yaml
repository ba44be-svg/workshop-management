      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: موفق

  # ============================================================
  # Reports
  # ============================================================
  /reports/dashboard/:
    get:
      tags: [reports]
      summary: داشبورد بلادرنگ مدیر
