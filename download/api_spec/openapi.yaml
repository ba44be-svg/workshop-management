      summary: گزارش ضایعات ماهانه
      responses:
        '200':
          description: موفق

  # ============================================================
  # Health
  # ============================================================
  /health/:
    get:
      tags: []
      summary: Health Check
      security: []
      description: بررسی سلامت سیستم و وابستگی‌ها (DB, Redis, Celery)
      responses:
        '200':
          description: سیستم سالم است
        '503':
          description: سرویس در حالت نامطلوب
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  checks:
                    type: object
