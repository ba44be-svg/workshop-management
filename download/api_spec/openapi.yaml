                  points:
                    type: integer
                  discount_pct:
                    type: number
                  credit_limit:
                    type: number

  /loyalty/transactions/:
    get:
      tags: [loyalty]
      summary: تراکنش‌های وفاداری
      parameters:
        - name: store_id
          in: query
      responses:
        '200':
          description: موفق

  # ============================================================
  # Notifications
  # ============================================================
  /notifications/unread-count/:
    get:
      tags: [notifications]
      summary: تعداد اعلان‌های خوانده‌نشده
      responses:
        '200':
          description: موفق
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  /notifications/:
    get:
      tags: [notifications]
      summary: لیست اعلان‌ها
