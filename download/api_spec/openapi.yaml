              schema:
                type: object
                properties:
                  today_sales:
                    type: number
                  today_dispatch_count:
                    type: integer
                  pending_approvals:
                    type: integer
                  near_expiry_lots:
                    type: integer
                  low_stock_products:
                    type: integer
                  active_stores:
                    type: integer
                  active_distributors:
                    type: integer

  /reports/geo-heatmap/:
    get:
      tags: [reports]
      summary: گزارش جغرافیایی Heatmap فروش
      parameters:
        - name: from_date
          in: query
        - name: to_date
          in: query
      responses:
        '200':
          description: موفق
          content:
            application/json:
              schema:
                type: object
                properties:
                  stores:
                    type: array
                    items:
                      type: object
                      properties:
                        store_id:
                          type: integer
