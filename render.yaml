services:
  # ─── بک‌اند Django ──────────────────────────────────────────
  - type: web
    name: workshop-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: workshop-db
          property: connectionString
    healthCheckPath: /api/health/

  # ─── فرانت‌اند Next.js ──────────────────────────────────────
  - type: web
    name: workshop-frontend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://workshop-backend.onrender.com/api

# ─── دیتابیس PostgreSQL ──────────────────────────────────────
databases:
  - name: workshop-db
    plan: free
