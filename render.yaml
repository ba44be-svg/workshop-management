# Render.com Blueprint — نرم‌افزار جامع مدیریت تولید و پخش

services:
  # ─── بک‌اند Django ──────────────────────────────────────────
  - type: web
    name: workshop-backend
    runtime: python
    region: frankfurt  # یا oregon
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements_local.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: True
      - key: DATABASE_URL
        fromDatabase:
          name: workshop-db
          property: connectionString

  # ─── فرانت‌اند Next.js ──────────────────────────────────────
  - type: web
    name: workshop-frontend
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://workshop-backend.onrender.com/api
      - key: NODE_ENV
        value: production

# ─── دیتابیس PostgreSQL ──────────────────────────────────────
databases:
  - name: workshop-db
    databaseName: workshop
    region: frankfurt
    plan: free
